<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Historial de ventas de Botanik: ordenes registradas, su estado y su detalle.">
  <title>Ordenes | Administracion Botanik</title>
  <link rel="icon" href="../img/ui/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <a class="bt-salto-contenido" href="#contenido">Saltar al contenido</a>

  <div class="bt-admin">

    <header class="bt-admin-lateral">
      <div class="bt-admin-marca">
        <img src="../img/ui/logo-blanco.svg" alt="Botanik">
        <p>Administracion</p>
      </div>

      <nav aria-label="Menu del administrador">
        <ul class="bt-admin-menu">
          <li><a href="index.html" data-bt-pagina="index.html">Inicio</a></li>
          <li><a href="ordenes.html" data-bt-pagina="ordenes.html">Ordenes</a></li>
          <li><a href="productos.html" data-bt-pagina="productos.html">Productos</a></li>
          <li data-bt-solo-administrador><a href="usuarios.html" data-bt-pagina="usuarios.html">Usuarios</a></li>
          <li><a href="../index.html">Ver la tienda</a></li>
        </ul>
      </nav>

      <div class="bt-admin-usuario">
        <span class="bt-admin-avatar" data-bt-iniciales-admin aria-hidden="true"></span>
        <div>
          <strong data-bt-nombre-admin></strong>
          <span data-bt-perfil-admin></span>
          <button class="bt-admin-salir" type="button" data-bt-cerrar-sesion data-bt-destino="../index.html?sesion=cerrada">Cerrar sesion</button>
        </div>
      </div>
    </header>

    <div class="bt-admin-columna">
      <main class="bt-admin-contenido" id="contenido">

        <div class="bt-admin-encabezado">
          <div>
            <h1>Ordenes</h1>
            <p class="text-body-secondary mb-0" data-bt-resumen-ventas role="status"></p>
          </div>
        </div>

        <section class="mb-3" aria-labelledby="tituloFiltrosOrdenes">
          <h2 class="visually-hidden" id="tituloFiltrosOrdenes">Filtros del historial</h2>
          <form class="row g-2">
            <div class="col-12 col-md-5">
              <label class="form-label visually-hidden" for="buscadorOrdenes">Buscar orden</label>
              <input class="form-control" type="search" id="buscadorOrdenes" name="buscadorOrdenes" placeholder="Buscar por numero, cliente o correo" autocomplete="off">
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label visually-hidden" for="filtroEstado">Filtrar por estado</label>
              <select class="form-select" id="filtroEstado" name="filtroEstado">
                <option value="">Todos los estados</option>
              </select>
            </div>
          </form>
        </section>

        <section aria-labelledby="tituloTablaOrdenes">
          <h2 class="visually-hidden" id="tituloTablaOrdenes">Historial de ventas</h2>
          <div class="bt-tabla-envoltorio">
            <table class="table bt-tabla">
              <caption class="visually-hidden">Ordenes registradas, ordenables por columna y paginadas</caption>
              <thead>
                <tr>
                  <th scope="col"><button class="bt-orden" type="button" data-bt-orden="numero">Numero</button></th>
                  <th scope="col"><button class="bt-orden" type="button" data-bt-orden="fecha">Fecha</button></th>
                  <th scope="col"><button class="bt-orden" type="button" data-bt-orden="clienteNombre">Cliente</button></th>
                  <th scope="col" class="bt-num"><button class="bt-orden" type="button" data-bt-orden="items">Items</button></th>
                  <th scope="col" class="bt-num"><button class="bt-orden" type="button" data-bt-orden="total">Total</button></th>
                  <th scope="col"><button class="bt-orden" type="button" data-bt-orden="estado">Estado</button></th>
                  <th scope="col" class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody data-bt-cuerpo-ordenes></tbody>
            </table>
          </div>

          <div class="bt-pie-tabla">
            <p class="text-body-secondary small mb-0" data-bt-info-tabla role="status"></p>
            <nav aria-label="Paginacion del historial">
              <ul class="pagination pagination-sm" data-bt-paginacion></ul>
            </nav>
          </div>
        </section>

      </main>

      <footer class="bt-admin-pie">
        Botanik &middot; Modulo de administracion &middot; <span data-bt-anio></span>
      </footer>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data/categorias.js"></script>
  <script src="../js/data/productos.js"></script>
  <script src="../js/data/regiones.js"></script>
  <script src="../js/data/usuarios.js"></script>
  <script src="../js/data/ordenes.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
